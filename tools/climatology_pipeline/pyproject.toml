[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencpn-climatology-pipeline"
version = "0.1.0"
description = "Reproducible builders and validators for OpenCPN Climatology data"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
source = ["xarray>=2024.1", "zarr>=2.16", "netCDF4>=1.6", "dask[array]>=2024.1"]
planette = ["icechunk>=1.1,<2", "s3fs>=2025.0"]
earthdata = ["earthaccess>=0.16"]
test = ["pytest>=8"]

[project.scripts]
climatology-inspect = "climatology_pipeline.inspect:main"
climatology-build-wind = "climatology_pipeline.build_wind:main"
climatology-build-cyclones = "climatology_pipeline.build_cyclones:main"
climatology-write-provenance = "climatology_pipeline.provenance:main"
climatology-build-current = "climatology_pipeline.oscar:main"
climatology-build-sst = "climatology_pipeline.oisst:main"
climatology-build-depth = "climatology_pipeline.bathymetry:main"
climatology-build-enso = "climatology_pipeline.enso:main"
climatology-build-atmosphere = "climatology_pipeline.planette:main"
climatology-build-cloud = "climatology_pipeline.cloud:main"
climatology-compare = "climatology_pipeline.compare:main"
climatology-merge-wind = "climatology_pipeline.merge_wind:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
